<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: black;
    overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
    color: #00e5ff;
  }

  .hud-color { color: var(--c, #00e5ff); }

  #app {
    position: relative;
    width: 100vw; height: 100vh;
    --c: #00e5ff;
  }

  /* faint scanline overlay for sci-fi feel */
  #app::before {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,229,255,0.03) 0px,
      rgba(0,229,255,0.03) 1px,
      transparent 2px,
      transparent 4px
    );
    pointer-events: none;
    z-index: 10;
  }

  /* ===== PANELS ===== */
  .panel {
    position: absolute;
    border: 1px solid var(--c);
    background: linear-gradient(180deg, rgba(0,229,255,0.05), rgba(0,229,255,0.01));
    box-shadow: 0 0 15px rgba(0,229,255,0.25), inset 0 0 15px rgba(0,229,255,0.08);
    padding: 16px 20px;
    clip-path: polygon(
      0 12px, 12px 0, 100% 0, 100% calc(100% - 12px),
      calc(100% - 12px) 100%, 0 100%
    );
  }

  .panel-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    opacity: 0.7;
    margin-bottom: 8px;
  }

  /* ===== CLOCK PANEL ===== */
  #clock-panel { top: 40px; left: 40px; width: 260px; }
  #clock-time {
    font-family: 'Orbitron', sans-serif;
    font-size: 34px; font-weight: 700;
    text-shadow: 0 0 10px var(--c);
  }
  #clock-date { font-size: 13px; opacity: 0.85; margin-top: 4px; }

  /* ===== SCHEDULE PANEL ===== */
  #schedule-panel { bottom: 40px; left: 40px; width: 300px; }
  #schedule-panel ul { list-style: none; margin-top: 6px; }
  #schedule-panel li { font-size: 13px; margin: 6px 0; opacity: 0.9; }
  #schedule-panel li::before { content: "▸ "; color: var(--c); }

  /* ===== STATUS PANEL ===== */
  #status-panel {
    bottom: 40px; left: 50%; transform: translateX(-50%);
    width: 620px; text-align: center;
  }
  #status-text { font-size: 15px; letter-spacing: 1px; }

  /* ===== PROJECT PANEL (top right) ===== */
  #project-panel { top: 40px; right: 40px; width: 280px; }
  #project-panel .row { display: flex; justify-content: space-between; font-size: 13px; margin: 5px 0; opacity: 0.9; }

  /* ===== SYSTEM STATS PANEL ===== */
  #stats-panel { top: 170px; right: 40px; width: 280px; }
  .stat-row { margin: 10px 0; }
  .stat-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
  .bar-bg { width: 100%; height: 6px; background: rgba(0,229,255,0.15); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--c); box-shadow: 0 0 8px var(--c); transition: width 0.5s ease; }

  /* ===== COMMAND LOG PANEL ===== */
  #log-panel { bottom: 40px; right: 40px; width: 320px; height: 180px; overflow: hidden; }
  #log-list { font-size: 11px; opacity: 0.85; display: flex; flex-direction: column-reverse; gap: 6px; margin-top: 6px; max-height: 140px; overflow: hidden; }
  #log-list div { border-left: 2px solid var(--c); padding-left: 8px; opacity: 0.9; }
  #log-list .log-time { opacity: 0.5; margin-right: 6px; }

  /* ===== CENTER REACTOR ===== */
  #reactor-wrap {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 420px; height: 420px;
  }
  svg { overflow: visible; }

  .ring-outer { animation: spin 12s linear infinite; transform-origin: center; }
  .ring-mid   { animation: spin-rev 8s linear infinite; transform-origin: center; }
  .ring-inner { animation: spin 5s linear infinite; transform-origin: center; }

  @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
  @keyframes spin-rev { from { transform: rotate(0deg);} to { transform: rotate(-360deg);} }

  .core-circle {
    animation: pulse 2.2s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes pulse {
    0%, 100% { r: 34; opacity: 0.9; }
    50% { r: 40; opacity: 1; }
  }

  #state-label {
    position: absolute; bottom: -40px; left: 50%; transform: translateX(-50%);
    font-family: 'Orbitron', sans-serif;
    font-size: 14px; letter-spacing: 4px;
    text-shadow: 0 0 10px var(--c);
  }

  .esc-hint {
    position: absolute; bottom: 14px; right: 20px;
    font-size: 10px; opacity: 0.4;
  }
</style>
</head>
<body>
<div id="app">

  <div class="panel" id="clock-panel">
    <div class="panel-label">SYSTEM TIME</div>
    <div id="clock-time">00:00:00</div>
    <div id="clock-date">Loading...</div>
  </div>

  <div class="panel" id="schedule-panel">
    <div class="panel-label">TODAY'S SCHEDULE</div>
    <ul id="schedule-list">
      <li>No calendar connected yet</li>
    </ul>
  </div>

  <div class="panel" id="project-panel">
    <div class="panel-label">AAGNEE CHRONICLES</div>
    <div class="row"><span>Status</span><span id="proj-status">In Dev</span></div>
    <div class="row"><span>Last Update</span><span id="proj-update">--</span></div>
  </div>

  <div class="panel" id="stats-panel">
    <div class="panel-label">SYSTEM STATUS</div>
    <div class="stat-row">
      <div class="stat-label"><span>CPU</span><span id="cpu-pct">0%</span></div>
      <div class="bar-bg"><div class="bar-fill" id="cpu-bar" style="width:0%"></div></div>
    </div>
    <div class="stat-row">
      <div class="stat-label"><span>RAM</span><span id="ram-pct">0%</span></div>
      <div class="bar-bg"><div class="bar-fill" id="ram-bar" style="width:0%"></div></div>
    </div>
    <div class="stat-row">
      <div class="stat-label"><span>WEATHER</span><span id="weather-text">--</span></div>
    </div>
  </div>

  <div class="panel" id="log-panel">
    <div class="panel-label">ACTIVITY LOG</div>
    <div id="log-list"></div>
  </div>

  <div class="panel" id="status-panel">
    <div id="status-text">Awaiting command...</div>
  </div>

  <div id="reactor-wrap">
    <svg viewBox="-210 -210 420 420" width="420" height="420">
      <g class="ring-outer">
        <circle r="150" fill="none" stroke="var(--c)" stroke-width="2"
                stroke-dasharray="14 10" opacity="0.8"/>
      </g>
      <g class="ring-mid">
        <circle r="115" fill="none" stroke="var(--c)" stroke-width="1.5"
                stroke-dasharray="4 6" opacity="0.7"/>
      </g>
      <g class="ring-inner">
        <circle r="85" fill="none" stroke="var(--c)" stroke-width="1"
                stroke-dasharray="2 4" opacity="0.6"/>
      </g>
      <circle r="60" fill="none" stroke="var(--c)" stroke-width="1" opacity="0.5"/>
      <circle class="core-circle" r="34" fill="var(--c)" opacity="0.9"
              style="filter: drop-shadow(0 0 20px var(--c));"/>
      <circle r="14" fill="white" style="filter: drop-shadow(0 0 10px white);"/>
    </svg>
    <div id="state-label">IDLE</div>
  </div>

  <div class="esc-hint">ESC to close</div>
</div>

<script>
  const app = document.getElementById('app');
  const stateColors = {
    idle: "#00e5ff",
    listening: "#00ffc8",
    thinking: "#a259ff",
    speaking: "#00ff9c"
  };

  function setState(state) {
    app.style.setProperty('--c', stateColors[state] || stateColors.idle);
    document.getElementById('state-label').textContent = state.toUpperCase();
  }

  function setStatusText(text) {
    document.getElementById('status-text').textContent = text;
  }

  function setSchedule(lines) {
    const ul = document.getElementById('schedule-list');
    ul.innerHTML = '';
    lines.forEach(l => {
      const li = document.createElement('li');
      li.textContent = l;
      ul.appendChild(li);
    });
  }

  function setProject(status, update) {
    document.getElementById('proj-status').textContent = status;
    document.getElementById('proj-update').textContent = update;
  }

  function setStats(cpuPct, ramPct) {
    document.getElementById('cpu-pct').textContent = cpuPct + '%';
    document.getElementById('cpu-bar').style.width = cpuPct + '%';
    document.getElementById('ram-pct').textContent = ramPct + '%';
    document.getElementById('ram-bar').style.width = ramPct + '%';
  }

  function setWeather(text) {
    document.getElementById('weather-text').textContent = text;
  }

  function addLogEntry(text) {
    const list = document.getElementById('log-list');
    const now = new Date();
    const timeStr = now.toLocaleTimeString('en-GB', {hour: '2-digit', minute:'2-digit'});
    const entry = document.createElement('div');
    entry.innerHTML = `<span class="log-time">${timeStr}</span>${text}`;
    list.appendChild(entry);
    // keep only last 8 entries
    while (list.children.length > 8) {
      list.removeChild(list.firstChild);
    }
  }

  function updateClock() {
    const now = new Date();
    document.getElementById('clock-time').textContent =
      now.toLocaleTimeString('en-GB');
    document.getElementById('clock-date').textContent =
      now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Escape key closes (handled by pywebview host too)
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && window.pywebview) {
      window.pywebview.api.close_window();
    }
  });

  setState("idle");
  setStatusText("Awaiting command...");
  setSchedule(["9:00 Standup", "1:00 Game dev session", "6:00 Gym"]);
  setProject("In Dev", "Yesterday");
</script>
</body>
</html>
